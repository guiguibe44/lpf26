# Déploiement vers OVH (mutualisé) via FTPS — secrets : OVH_FTP_HOST, OVH_FTP_USER, OVH_FTP_PASSWORD, OVH_FTP_SERVER_DIR
name: Deploy OVH (FTP)

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-ovh-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            APP_ENV: prod
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: ctype, iconv, intl, pdo, pdo_mysql, pdo_pgsql, mbstring, fileinfo
                  coverage: none
                  tools: composer:v2

            - name: Composer install
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            # Requis par symfonycasts/tailwind-bundle avant asset-map:compile (fichier généré absent sur checkout nu)
            - name: Build Tailwind CSS (prod)
              run: php bin/console tailwind:build --env=prod --no-interaction --minify

            - name: Compile asset map (prod)
              run: php bin/console asset-map:compile --env=prod --no-interaction
              continue-on-error: false

            # Message explicite si un secret manque (sinon FTP-Deploy-Action : « Input required and not supplied: server »)
            - name: Vérifier les secrets FTP OVH
              env:
                  OVH_FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
                  OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
                  OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
                  OVH_FTP_SERVER_DIR: ${{ secrets.OVH_FTP_SERVER_DIR }}
              run: |
                  set -e
                  ok=1
                  if [ -z "$OVH_FTP_HOST" ]; then
                    echo "::error::Secret GitHub OVH_FTP_HOST manquant ou vide (hôte FTP, ex. ftp.clusterXXX.hosting.ovh.net). Réglages : dépôt → Settings → Secrets and variables → Actions."
                    ok=0
                  fi
                  if [ -z "$OVH_FTP_USER" ]; then
                    echo "::error::Secret OVH_FTP_USER manquant ou vide."
                    ok=0
                  fi
                  if [ -z "$OVH_FTP_PASSWORD" ]; then
                    echo "::error::Secret OVH_FTP_PASSWORD manquant ou vide."
                    ok=0
                  fi
                  if [ -z "$OVH_FTP_SERVER_DIR" ]; then
                    echo "::error::Secret OVH_FTP_SERVER_DIR manquant ou vide (dossier distant avec / final, ex. www/)."
                    ok=0
                  fi
                  if [ "$ok" -ne 1 ]; then
                    exit 1
                  fi
                  echo "Les quatre secrets OVH_FTP_* sont renseignés."

            - name: Deploy via FTPS
              uses: SamKirkland/FTP-Deploy-Action@v4.3.6
              with:
                  server: ${{ secrets.OVH_FTP_HOST }}
                  username: ${{ secrets.OVH_FTP_USER }}
                  password: ${{ secrets.OVH_FTP_PASSWORD }}
                  server-dir: ${{ secrets.OVH_FTP_SERVER_DIR }}
                  protocol: ftps
                  timeout: 600000
                  exclude: |
                      **/.git*
                      **/.github/**
                      **/tests/**
                      **/var/**
                      **/.env.local
                      **/.env.*.local
                      **/phpunit.dist.xml
                      **/compose*.yaml
                      **/node_modules/**
                      **/public/uploads/**
                  log-level: verbose
