# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.competition_start_at: '%env(default::COMPETITION_START_AT)%'
    app.cotisation_wire_phone: '%env(default::COTISATION_WIRE_PHONE)%'
    app.image_upload.webp_quality: 82
    app.image_upload.jpeg_quality: 85
    app.image_upload.png_compression: 8
    env(VAPID_PUBLIC_KEY): ''
    env(VAPID_PRIVATE_KEY): ''
    env(VAPID_SUBJECT): ''
    app.vapid_public_key: '%env(VAPID_PUBLIC_KEY)%'
    app.vapid_private_key: '%env(VAPID_PRIVATE_KEY)%'
    app.vapid_subject: '%env(VAPID_SUBJECT)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\CompetitionStatus:
        arguments:
            $competitionStartAt: '%app.competition_start_at%'

    App\Service\WebPushService:
        arguments:
            $vapidPublicKey: '%app.vapid_public_key%'
            $vapidPrivateKey: '%app.vapid_private_key%'
            $vapidSubject: '%app.vapid_subject%'

    App\Command\PushTestSendCommand:
        arguments:
            $vapidPublicKey: '%app.vapid_public_key%'
            $vapidPrivateKey: '%app.vapid_private_key%'
            $vapidSubject: '%app.vapid_subject%'

    App\Service\ApiFootballClient:
        arguments:
            $apiKey: '%env(default::API_FOOTBALL_KEY)%'
            $playerSyncStop: '@App\Service\ApiFootballPlayerSyncStop'
            $requestDelayMs: '%env(int:API_FOOTBALL_REQUEST_DELAY_MS)%'

    App\Service\ApiFootballPlayerSyncStop:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\RemoteImageStorage:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ImageUploadOptimizer:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $webpQuality: '%app.image_upload.webp_quality%'
            $jpegQuality: '%app.image_upload.jpeg_quality%'
            $pngCompression: '%app.image_upload.png_compression%'

    App\Service\UploadedImageStorage:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Wc2026SyncService:
        arguments:
            $apiFootballWorldCupLeagueId: '%env(int:API_FOOTBALL_WC_LEAGUE_ID)%'
            $apiFootballWorldCupSeason: '%env(int:API_FOOTBALL_WC_SEASON)%'
            $apiFootballSyncGoalsMaxRequests: '%env(int:API_FOOTBALL_SYNC_GOALS_MAX_REQUESTS)%'

    App\Controller\Admin\DashboardController:
        arguments:
            $apiFootballSyncMaxRequests: '%env(int:API_FOOTBALL_SYNC_MAX_REQUESTS)%'

    # EasyAdmin instancie chaque CRUD via le conteneur ; sans entrée explicite, le cache prod
    # génère `new UserCrudController()` sans argument (ArgumentCountError sur toute page admin).
    App\Controller\Admin\UserCrudController:
        arguments:
            $passwordHasher: '@security.user_password_hasher'
            $uploadedImageFinalize: '@App\Service\UploadedImageFinalizeService'

    App\Mailer\Transport\PhpMailTransportFactory:
        tags: ['mailer.transport_factory']

    App\Command\Wc2026SyncCommand:
        arguments:
            $syncService: '@App\Service\Wc2026SyncService'
            $defaultPlayersSyncMaxRequests: '%env(int:API_FOOTBALL_SYNC_MAX_REQUESTS)%'
